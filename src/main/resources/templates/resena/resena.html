<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{resenas.titulo}">Reseñas</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
  <style>
    .stars {
      display: flex;
      gap: 8px;
      font-size: 32px;
      cursor: pointer;
      user-select: none;
    }

    .stars span {
      color: #d3d3d3;
      transition: color 0.15s ease;
    }

    .stars span.filled {
      color: gold;
    }
  </style>
</head>

<body th:attr="lang=${#locale.language}">
  <header th:replace="general/navbar :: navbar"></header>

  <main class="centrado" style="padding: 32px 16px;">
    <section class="contenedor-formulario" style="max-width: 760px;">
      <h2 th:text="#{resenas.titulo}">Reseñas de Clientes</h2>

      <div th:if="${comentarios != null and !#lists.isEmpty(comentarios)}" style="margin-bottom: 18px;">
        <ul style="padding-left: 18px; margin: 0;">
          <li th:each="comentario : ${comentarios}" style="margin-bottom: 14px; list-style: disc;">
            <div>
              <strong th:text="${comentario.usuario.nombre}">Cliente</strong>
              <span th:text="${#temporals.format(comentario.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </div>
            <div th:text="${comentario.contenido}" style="margin: 6px 0;"></div>
            <div>
              <span th:text="#{resenas.calificacion} + ' '"></span>
              <span th:each="i : ${#numbers.sequence(1, comentario.calificacion)}">&#11088;</span>
            </div>
          </li>
        </ul>
      </div>
      <p th:if="${comentarios == null or #lists.isEmpty(comentarios)}" th:text="#{resenas.sinResenas}"
        style="margin-bottom: 18px;">No reviews yet.</p>

      <form th:action="@{/resenas/guardar}" method="post" th:object="${comentario}" style="display: grid; gap: 12px;">
        <label for="comentario" th:text="#{resenas.escribir}">Escribe tu reseña:</label>
        <textarea id="comentario" th:field="*{contenido}" rows="3" required></textarea>

        <label th:for="calificacion" th:text="#{resenas.calificacion}">Calificación:</label>
        <input id="calificacion" type="hidden" th:field="*{calificacion}" required>
        <div class="stars" id="stars">
          <span th:each="i : ${#numbers.sequence(1,5)}" th:attr="data-value=${i}"
            th:classappend="${i <= (comentario.calificacion != null ? comentario.calificacion : 0)} ? 'filled' : ''">&#9733;</span>
        </div>

        <button type="submit" class="btn" th:text="#{resenas.enviar}">Enviar Reseña</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Mommys Ice Cream</p>
  </footer>
  <script>
    (function () {
      const stars = document.querySelectorAll('#stars span');
      const input = document.getElementById('calificacion');

      function setRating(val) {
        input.value = val;
        stars.forEach(star => {
          const v = parseInt(star.getAttribute('data-value'), 10);
          star.classList.toggle('filled', v <= val);
        });
      }

      stars.forEach(star => {
        star.addEventListener('click', () => {
          const val = parseInt(star.getAttribute('data-value'), 10);
          setRating(val);
        });
        star.addEventListener('mouseenter', () => {
          const val = parseInt(star.getAttribute('data-value'), 10);
          stars.forEach(s => {
            const v = parseInt(s.getAttribute('data-value'), 10);
            s.classList.toggle('filled', v <= val);
          });
        });
      });

      document.getElementById('stars').addEventListener('mouseleave', () => {
        const current = parseInt(input.value || '0', 10);
        setRating(current);
      });

      // default rating if none selected
      if (!input.value) setRating(5);
    })();
  </script>
  <script src="/js/lang.js"></script>
  <!-- Script para abrir el menu del carrito como un hamburger menu -->
  <script>
    function toggleCarritoMenu() {
      let menu = document.getElementById("carritoMenu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }

    // Cerrar si se hace clic afuera
    document.addEventListener("click", function (e) {
      const menu = document.getElementById("carritoMenu");
      const container = document.querySelector(".carrito-menu-container");
      if (!container.contains(e.target)) {
        menu.style.display = "none";
      }
    });
  </script>
</body>

</html>
