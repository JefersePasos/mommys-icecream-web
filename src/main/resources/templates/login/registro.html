<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/css/estilos.css">
        <title th:text="#{registro.titulo}">Account Registration</title>
    </head>
    <body> 
        <header th:replace="general/navbar :: navbar"></header>
        <div class="centrado">
            <div class="contenedor-formulario">
                <!-- Aca iniciamos el crear una nueva cuenta hecha por Deyvin -->
                <h2 th:text="#{registro.crearCuenta}">Create Account</h2>

                <div th:if="${error}" class="error" th:text="${error}"></div>
                <div th:if="${mensaje}" class="mensaje" th:text="${mensaje}"></div>

                <form th:action="@{/registro}" th:object="${usuario}" method="post">
                    <label th:text="#{registro.nombre}">First Name</label>
                    <input type="text" th:field="*{nombre}" required /><br/>

                    <label th:text="#{registro.primerApellido}">Last Name</label>
                    <input type="text" th:field="*{primerApellido}" required /><br/>

                    <label th:text="#{registro.segundoApellido}">Second Last Name</label>
                    <input type="text" th:field="*{segundoApellido}" /><br/>

                    <label th:text="#{registro.fechaNacimiento}">Birth date</label>
                    <input type="date" th:field="*{fechaNacimiento}" /><br/>

                    <label th:text="#{registro.correo}">Email</label>
                    <input type="email" th:field="*{correo}" required /><br/>

                    <label th:text="#{registro.contrasena}">Password</label>
                    <input type="password" th:field="*{contrasena}" required /><br/>

                    <label th:text="#{registro.provincia}">Province</label>
                    <input type="text" th:field="*{provincia}" /><br/>

                    <label th:text="#{registro.canton}">Canton</label>
                    <input type="text" th:field="*{canton}" /><br/>

                    <label th:text="#{registro.distrito}">District</label>
                    <input type="text" th:field="*{distrito}" /><br/>

                    <label th:text="#{registro.direccionExacta}">Exact Address</label>
                    <textarea th:field="*{direccionExacta}"></textarea><br/>

                    <!-- Teléfonos dinámicos (opcional, aquí solo uno por ahora) -->
                    <label th:text="#{registro.telefono}">Phone</label>
                    <input type="text" name="telefonos[0].numero" /><br/>

                    <button type="submit" th:text="#{registro.registrase}">Sign up</button>
                </form>

                <p>
                    <span th:text="#{registro.yaTieneCuenta}">Already have an account?</span>
                    <a href="/login" th:text="#{registro.login}">Sign in</a>
                </p>
                <!-- Aca finalizamos el crear una nueva cuenta hecha por Deyvin -->
            </div>
        </div>    
<script src="/js/lang.js"></script>
    <!-- Script para abrir el menu del carrito como un hamburger menu -->
    <script>
        function toggleCarritoMenu() {
            let menu = document.getElementById("carritoMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        // Cerrar si se hace clic afuera
        document.addEventListener("click", function(e){
            const menu = document.getElementById("carritoMenu");
            const container = document.querySelector(".carrito-menu-container");
            if (!container.contains(e.target)) {
                menu.style.display = "none";
            }
        });
    </script>
</body>
</html>
