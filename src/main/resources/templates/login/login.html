<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/css/estilos.css">
        <title th:text="#{login.titulo}">Sign In</title>
    </head>

    <body> 
        <header th:replace="general/navbar :: navbar"></header>
        
        <div class="centrado">
            <div class="contenedor-formulario">
                <h2 th:text="#{login.titulo2}">Sign In</h2>

                <div th:if="${error}">
                    <p class="error" th:text="${error}"></p>
                </div>

                <form th:action="@{/login}" th:object="${usuario}" method="post">
                    <label th:text="#{login.correo}">Email</label>
                    <input type="email" th:field="*{correo}" required />

                    <label th:text="#{login.contrasena}">Password</label>
                    <input type="password" th:field="*{contrasena}" required />

                    <button type="submit" th:text="#{login.ingresar}">Sign in</button>
                </form>

                <p>
                    <span th:text="#{login.noCuenta}">Don't have an account?</span>
                    <a href="/registro" th:text="#{login.registrar}">Register</a>
                </p>
            </div>
        </div>
    <script src="/js/lang.js"></script>
    <!-- Script para abrir el menu del carrito como un hamburger menu -->
    <script>
        function toggleCarritoMenu() {
            let menu = document.getElementById("carritoMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        // Cerrar si se hace clic afuera
        document.addEventListener("click", function(e){
            const menu = document.getElementById("carritoMenu");
            const container = document.querySelector(".carrito-menu-container");
            if (!container.contains(e.target)) {
                menu.style.display = "none";
            }
        });
    </script>
    </body>
</html>
