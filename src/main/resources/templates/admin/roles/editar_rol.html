<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">

<head>
    <meta charset="UTF-8" />
            <link rel="icon" th:href="@{/img/logo.png}" type="image/png" />
        <title th:text="#{roles.editarRol}">Edit Role</title>
    <link rel="stylesheet" href="/css/estilos.css" />
</head>

<body>
    <header th:replace="general/navbar :: navbar"></header>
    <div class="centrado">
        <div class="contenedor-formulario">
            <h2 th:text="#{roles.editarRol}">Edit Role</h2>

            <form th:action="@{/admin/roles/editar}" th:object="${rol}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{nombreEn}" />

                <label th:text="#{roles.nombre}">Role Name:</label>
                <input type="text" th:field="*{nombre}" required />

                <br><br>
                <button type="submit" th:text="#{boton.guardarChanges}">Save changes</button>
            </form>

            <div style="margin-top: 1em;">
                <a href="/admin/roles/dashboard">
                    <button style="background-color: var(--gris); color: var(--texto);" th:text="#{boton.cancelar}">Cancel</button>
                </a>
            </div>
        </div>
    </div>
    <script src="/js/lang.js"></script>

    <!-- Script para abrir el menu del carrito como un hamburger menu -->
    <script>
        function toggleCarritoMenu() {
            let menu = document.getElementById("carritoMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        // Cerrar si se hace clic afuera
        document.addEventListener("click", function(e){
            const menu = document.getElementById("carritoMenu");
            const container = document.querySelector(".carrito-menu-container");
            if (!container.contains(e.target)) {
                menu.style.display = "none";
            }
        });
    </script>
</body>

</html>
