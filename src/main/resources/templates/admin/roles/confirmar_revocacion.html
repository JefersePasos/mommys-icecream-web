</head>
<body>
    <header th:replace="general/navbar :: navbar"></header>

    <div class="centrado">
        <div class="contenedor-formulario">
            <h2 style="color: red;" th:text="#{roles.confirmarRevocacion.titulo}">Â¿Revocar rol?</h2>
            <p th:text="${#messages.msg('roles.confirmarRevocacion.detalle', usuario.rol.nombre, usuario.nombre + ' ' + usuario.primerApellido)}">
                Â¿EstÃ¡s seguro de que deseas quitar el rol?
            </p>

            <form th:action="@{'/admin/roles/revocar/' + ${usuario.id}}" method="post">
                <button type="submit" th:text="#{roles.confirmarRevocacion.boton}">SÃ­, revocar rol</button>
            </form>

            <div style="margin-top: 1em;">
                <a href="/admin/roles/dashboard">
                    <button style="background-color: var(--gris); color: var(--texto);" th:text="#{boton.cancelar}">Cancelar</button>
                </a>
            </div>
        </div>
    </div>

    <script src="/js/lang.js"></script>
    <script>
        function toggleCarritoMenu() {
            const menu = document.getElementById("carritoMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        document.addEventListener("click", function(e){
            const menu = document.getElementById("carritoMenu");
            const container = document.querySelector(".carrito-menu-container");
            if (menu && container && !container.contains(e.target)) {
                menu.style.display = "none";
            }
        });
    </script>
</body>
