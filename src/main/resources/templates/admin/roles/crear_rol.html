<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">
<head>
    <meta charset="UTF-8" />
    <title th:text="#{roles.crearNuevoRolTitulo}">Crear Nuevo Rol</title>
    <link rel="stylesheet" href="/css/estilos.css" />
</head>
<body>
    <header th:replace="general/navbar :: navbar"></header>

    <div class="centrado">
        <div class="contenedor-formulario">
            <h2 th:text="#{roles.crearNuevoRolTitulo}">Crear Nuevo Rol</h2>

            <form th:action="@{/admin/roles/crear}" method="post">
                <label for="nombre" th:text="#{roles.nombreRolLabel}">Nombre del rol</label>
                <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="50" />
                <button type="submit" th:text="#{boton.guardar}">Guardar</button>
                <div th:if="${error}" class="error" th:text="${error}"></div>
            </form>

            <div style="margin-top: 1em;">
                <a href="/admin/roles/dashboard">
                    <button style="background-color: var(--gris); color: var(--texto);" th:text="#{boton.cancelar}">Cancelar</button>
                </a>
            </div>
        </div>
    </div>

    <script src="/js/lang.js"></script>
    <script>
        function toggleCarritoMenu() {
            const menu = document.getElementById("carritoMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        document.addEventListener("click", function(e){
            const menu = document.getElementById("carritoMenu");
            const container = document.querySelector(".carrito-menu-container");
            if (menu && container && !container.contains(e.target)) {
                menu.style.display = "none";
            }
        });
    </script>
</body>
</html>
