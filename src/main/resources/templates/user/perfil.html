<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">
    <head>
        <meta charset="UTF-8">
        <title>Perfil</title>
        <link rel="stylesheet" href="/css/estilos.css">
    </head>
    <body> 
        <header th:replace="general/navbar :: navbar"></header>
        <div class="centrado">

            <div class="contenedor-formulario">
                <h2>Hola, <span th:text="${usuario.nombre}">Usuario</span> 👋</h2>

                <div class="perfil-datos">
                    <p><strong th:text="#{registro.correo}">Correo</strong>: <span th:text="${usuario.correo}"></span></p>
                    <p><strong th:text="#{registro.provincia}">Provincia</strong>: <span th:text="${usuario.provincia}"></span></p>
                    <p><strong th:text="#{registro.canton}">Cantón</strong>: <span th:text="${usuario.canton}"></span></p>
                    <p><strong th:text="#{registro.distrito}">Distrito</strong>: <span th:text="${usuario.distrito}"></span></p>
                    <p><strong th:text="#{registro.direccionExacta}">Dirección Exacta</strong>: <span th:text="${usuario.direccionExacta}"></span></p>
                </div>

                <div style="margin-top: 1.5em; display: flex; flex-direction: column; gap: 0.5em;">
                    <a href="/editar-perfil" style="text-decoration: none">
                        <button style="background-color: var(--naranja); text-decoration: none; color: var(--texto); font-weight: 600;" th:text="#{cuenta.editarPerfil}">Editar perfil</button>
                    </a>

                    <form action="/logout" method="post">
                        <button type="submit" style="background-color: var(--gris); text-decoration: none; color: var(--texto); font-weight: 600;" th:text="#{cuenta.cerrarSesion}">Cerrar sesión</button>
                    </form>

                    <form action="/confirmar-eliminacion" method="get">
                        <button type="submit" style="background-color: var(--rosado); text-decoration: none; color: var(--texto); font-weight: 600;" th:text="#{cuenta.eliminar}">Eliminar cuenta</button>
                    </form>
                </div>
                <!-- Solo mostrar si el usuario es Administrador por seguridad-->
                <div th:if="${usuario != null and usuario.rol != null
                     and #strings.equalsIgnoreCase(usuario.rol.nombre,'Administrador')}"
                     style="margin-top:1em;">
                    <a th:href="@{/admin/roles/dashboard}" style="text-decoration: none; font-weight: 600;">
                        <button style="background-color: var(--durazno); text-decoration: none; color: var(--texto); font-weight: 600;" th:text="#{cuenta.irPanelRoles}">Ir al Panel de Roles</button>
                    </a>
                    <a th:href="@{/productos/dashboardProductos}" style="text-decoration: none; font-weight: 600;">
                        <button style="background-color: var(--menta); text-decoration: none; color: var(--texto); font-weight: 600;" th:text="#{producto.gestionProductos}">Gestión de Productos</button>
                    </a>
                </div>
            </div>

        </div>    
    <script src="/js/lang.js"></script>
    <!-- Script para abrir el menu del carrito como un hamburger menu -->
    <script>
        function toggleCarritoMenu() {
            let menu = document.getElementById("carritoMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        // Cerrar si se hace clic afuera
        document.addEventListener("click", function(e){
            const menu = document.getElementById("carritoMenu");
            const container = document.querySelector(".carrito-menu-container");
            if (!container.contains(e.target)) {
                menu.style.display = "none";
            }
        });
    </script>
    </body> 
</html>
