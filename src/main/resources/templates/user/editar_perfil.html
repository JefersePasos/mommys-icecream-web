<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png" />
    <title th:text="#{perfil.editar.titulo}">Editar perfil</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
</head>
<body>
<header th:replace="general/navbar :: navbar"></header>
<div class="centrado">
    <div class="contenedor-formulario">
        <h2 th:text="#{perfil.editar.titulo}">Editar perfil</h2>

        <div th:if="${mensaje}" class="mensaje" th:text="${mensaje}"></div>

        <form th:action="@{/editar-perfil}" th:object="${usuario}" method="post">
            <label th:text="#{registro.nombre}">Nombre</label>
            <input type="text" th:field="*{nombre}" required />

            <label th:text="#{registro.primerApellido}">Primer Apellido</label>
            <input type="text" th:field="*{primerApellido}" required />

            <label th:text="#{registro.segundoApellido}">Segundo Apellido</label>
            <input type="text" th:field="*{segundoApellido}" />

            <label th:text="#{registro.correo}">Correo</label>
            <input type="email" th:field="*{correo}" required />

            <label th:text="#{perfil.editar.nuevaContrasena}">Nueva contraseña (opcional)</label>
            <input type="password" th:field="*{contrasena}" />

            <label th:text="#{registro.provincia}">Provincia</label>
            <input type="text" th:field="*{provincia}" />

            <label th:text="#{registro.canton}">Cantón</label>
            <input type="text" th:field="*{canton}" />

            <label th:text="#{registro.distrito}">Distrito</label>
            <input type="text" th:field="*{distrito}" />

            <label th:text="#{registro.direccionExacta}">Dirección Exacta</label>
            <textarea th:field="*{direccionExacta}"></textarea>

            <button type="submit" th:text="#{perfil.editar.guardar}">Guardar cambios</button>
        </form>

        <div style="margin-top: 1em;">
            <a th:href="@{/perfil}" th:text="#{perfil.editar.volver}">Volver al perfil</a>
        </div>
    </div>
</div>
<script src="/js/lang.js"></script>
</body>
</html>
