<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">
    <head>
        <meta charset="UTF-8" />
                <link rel="icon" th:href="@{/img/logo.png}" type="image/png" />
        <title th:text="#{producto.gestionProductos}">Products â€” Mommyâ€™s Ice Cream</title>
        <link rel="stylesheet" th:href="@{/css/estilos.css}" />
    </head>
    <body>
        <!-- Barra superior -->
        <header th:replace="general/navbar :: navbar"></header>
        <!-- Contenido -->
        <div class="centrado" style="align-items:flex-start;">
            <div class="contenedor-formulario" style="max-width:1100px; width:100%;">
                <h2 style="margin-top:0;" th:text="#{producto.gestionProductos}">Product Management</h2>

                <!-- BotÃ³n agregar -->
                <div style="display:flex; justify-content:flex-end; margin-bottom:14px;">
                    <a th:href="@{/productos/nuevo}" class="btn pill" style="text-decoration:none;" th:text="#{producto.agregarProducto}">
                        Add Product
                    </a>
                </div>

                <!-- Tabla -->
                <div style="overflow:auto;">
                    <table style="
                           width:100%;
                           border-collapse:separate;
                           border-spacing:0 10px;       
                           ">
                        <thead>
                            <tr>
                                <th style="text-align:left; padding:10px 12px; color:var(--texto-suave);" th:text="#{tabla.id}">ID</th>
                                <th style="text-align:left; padding:10px 12px; color:var(--texto-suave);" th:text="#{tabla.sabor}">Flavor</th>
                                <th style="text-align:left; padding:10px 12px; color:var(--texto-suave);" th:text="#{tabla.estado}">Status</th>
                                <th style="text-align:center; padding:10px 12px; color:var(--texto-suave);" th:text="#{tabla.acciones}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="producto : ${productos}" style="background:#fff; box-shadow:0 4px 10px rgba(0,0,0,.06);">
                                <td style="padding:14px 12px; border-radius:10px 0 0 10px;" th:text="${producto.id}">1</td>
                                <td style="padding:14px 12px;"
                                    th:text="${#locale.language == 'en' ? (#strings.isEmpty(producto.saborEn) ? producto.sabor : producto.saborEn) : producto.sabor}">
                                    Flavor
                                </td>
                                <td style="padding:14px 12px;">
                                    <span th:text="${producto.status} ? #{estado.disponible} : #{estado.no-disponible}"></span>
                                </td>
                                <td style="padding:10px 12px; border-radius:0 10px 10px 0;">
                                    <div style="display:flex; gap:10px; justify-content:center;">
                                        <a th:href="@{'/productos/editar/' + ${producto.id}}" class="btn pill" style="background:var(--naranja);" th:text="#{boton.editar}">
                                            Edit
                                        </a>
                                        <a th:href="@{'/productos/eliminar/' + ${producto.id}}" class="btn pill" style="background:var(--rosado); color:#800000;" th:text="#{boton.borrar}">
                                            Delete
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 Mommys Ice Cream</p>
        </footer>
    <script src="/js/lang.js"></script>
    <!-- Script para abrir el menu del carrito como un hamburger menu -->
    <script>
        function toggleCarritoMenu() {
            let menu = document.getElementById("carritoMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        // Cerrar si se hace clic afuera
        document.addEventListener("click", function(e){
            const menu = document.getElementById("carritoMenu");
            const container = document.querySelector(".carrito-menu-container");
            if (!container.contains(e.target)) {
                menu.style.display = "none";
            }
        });
    </script>
    </body>
</html>
