# Sobre nosotros
sobre.hero.title=¿A qué nos dedicamos?
sobre.hero.body=Somos un peque\u00F1o emprendimiento dedicado a la elaboraci\u00F3n artesanal de apretados en leche y en agua. Vendemos nuestros helados a peque\u00F1a y gran escala. Estamos dedicados a proveer los helados m\u00E1s deliciosos al mejor precio con el toque \u00FAnico de \u201Cmam\u00E1\u201D.
sobre.badge.artesanal=\uD83E\uDD5B Artesanal
sobre.badge.fruta=\uD83C\uDF53 Fruta natural
sobre.badge.casa=\uD83D\uDC69\u200D\uD83D\uDC67 Hecho en casa
sobre.historia.titulo=Historia
sobre.historia.texto=Helados de Mam\u00E1 naci\u00F3 en el a\u00F1o 2020 durante la pandemia. Marielen Chavarr\u00EDa, su due\u00F1a y creadora, inici\u00F3 siguiendo recetas en YouTube para mantener a sus hijos frescos en el calor de Guanacaste. Tras compartir sus helados con familiares y amigos, estos la animaron a abrir e iniciar su negocio.
sobre.historia.subtitulo=De una cocina en casa a un negocio familiar.
