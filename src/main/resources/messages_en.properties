sobre.historia.titulo=Our story
sobre.historia.texto=Mommy\u0027s Ice Cream was born in 2020 during the pandemic. Marielen Chavarria, its owner and creator, started by following YouTube recipes to keep her kids cool in Guanacaste's heat. After sharing her ice creams with family and friends, they encouraged her to start the business.
